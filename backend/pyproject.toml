[project]
name = "face-match"
version = "0.1.0"
description = "Local face match system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.30.0",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Ruff is configured once at the repo root (`ruff.toml`) so `eval/` and `tools/` — which
# sit above this directory — resolve the same first-party roots and the same rule set no
# matter which directory ruff is invoked from.

[tool.mypy]
python_version = "3.12"
strict = true
# `eval/` is real, shipped code (spec section 10), so it type-checks with `app`.
files = ["app", "../eval", "../tools"]
mypy_path = ".:../eval"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors so our own deprecations surface immediately. Third-party import-time
# deprecations (starlette/anyio) are ignored by message, not blanket-disabled.
filterwarnings = [
    "error",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
